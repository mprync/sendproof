# Conformance fixture. The runner supplies PORT, BENCH_PATH_BASE and BENCH_SCENARIO.
spring.application.name=Test Bench Conformance
server.port=${PORT:8080}
server.address=127.0.0.1
server.servlet.context-path=${BENCH_PATH_BASE:}
spring.profiles.active=scenario-${BENCH_SCENARIO:standard}
spring.main.banner-mode=off
spring.mvc.problemdetails.enabled=true

# One real relational table, empty at every process start.
spring.datasource.url=jdbc:h2:mem:fixture;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Test Bench. Enabled per scenario in application-scenario-*.properties.
testbench.environment=Development
testbench.api-name=Test Bench Conformance
testbench.trace.retention=5s
testbench.sql.include-parameter-values=true
testbench.auth-providers[0].label=Fixture password
testbench.auth-providers[0].kind=cookie
testbench.auth-providers[0].url=/auth/sign-in
testbench.auth-providers[1].label=Fixture personas
testbench.auth-providers[1].kind=personas
testbench.auth-providers[1].url=/auth/personas
