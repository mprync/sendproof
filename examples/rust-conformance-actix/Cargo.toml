[package]
name = "rust-conformance-actix"
description = "Test Bench conformance fixture for the Rust adapters: Actix Web + SQLx (SQLite, PostgreSQL or MySQL)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
workspace = "../../adapters/rust"

[dependencies]
rust-conformance-common = { path = "../rust-conformance-common" }
testbench-actix.workspace = true
testbench-core.workspace = true
testbench-sqlx = { workspace = true, features = ["actix", "sqlite", "postgres", "mysql"] }
actix-web.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
tracing-subscriber.workspace = true
