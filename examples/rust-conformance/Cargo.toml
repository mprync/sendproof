[package]
name = "rust-conformance"
description = "Test Bench conformance fixture for the Rust adapters: Axum + SQLx (SQLite, PostgreSQL or MySQL)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
workspace = "../../adapters/rust"

[dependencies]
rust-conformance-common = { path = "../rust-conformance-common" }
testbench-axum.workspace = true
testbench-core.workspace = true
testbench-sqlx = { workspace = true, features = ["axum", "sqlite", "postgres", "mysql"] }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
tracing-subscriber.workspace = true
