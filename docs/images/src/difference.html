<!doctype html>

<head>

<title>Sendproof: a journey step that differs</title>

  #canvas { width: 1180px; padding: 40px 40px 52px; }

<div id="canvas">
  <div class="window" style="position: relative; width: 1030px">

      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span><b>localhost:5189</b>/sendproof</span></div>
      <div class="tail"></div>

    <!-- The same journey with another carrier: step 4 writes something other than it should. -->
    <div class="crop" data-raw="journey-difference" data-region="full" data-width="1030"><img alt=""></div>
  </div>
  <div class="panel finding" data-optional-group>
    <!-- Step 4 on its own screen: what it should have written next to what it wrote, field by field. -->

  </div>
</div>
