<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sendproof: social preview</title>
<link rel="stylesheet" href="frame.css">
<style>
  /* GitHub's social preview: 1280x640. Text stays inside a 40 px safe margin. */
  #canvas { width: 1280px; height: 640px; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .mark { width: 52px; height: 52px; border-radius: 13px; background: oklch(0.22 0.012 268); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px -8px oklch(0.3 0.1 268 / 0.5); }
  :root.dark .mark { background: #fff; color: oklch(0.22 0.012 268); }
  .mark svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 50px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 600; }
  h1 em { font-style: normal; color: var(--accent); }
  p { font-size: 21px; line-height: 1.45; color: var(--muted); }
  .langs { display: flex; flex-wrap: wrap; gap: 8px; }
  .langs span { font-size: 15px; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--chip); box-shadow: 0 0 0 1px var(--edge); }
  .shot { left: 640px; top: 76px; width: 760px; }
</style>
<script src="../../../artifacts/readme/raw/manifest.js"></script>
<script src="frame.js"></script>
</head>
<body>
<div id="canvas">
  <div class="copy">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M4 9h16"/><path d="M6 9V5h12v4"/><path d="M7 9v10M17 9v10"/></svg></span>Sendproof</div>
    <h1>See what an API call <em>will change</em> before you send it.</h1>
    <p>An OpenAPI workbench inside your API. Preview runs the real handler and rolls it back.</p>
    <div class="langs"><span>.NET</span><span>Node.js</span><span>Python</span><span>Java &amp; Kotlin</span><span>Go</span><span>PHP</span><span>Ruby</span><span>Rust</span></div>
  </div>
  <div class="window shot">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span><b>localhost:5189</b>/sendproof</span></div>
      <div class="tail"></div>
    </div>
    <div class="crop" data-raw="order-database" data-region="result" data-width="760" data-height="600"><img alt=""></div>
  </div>
</div>
</body>
</html>
