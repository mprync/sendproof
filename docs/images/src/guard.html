<!doctype html>
<html lang="en">
<head>

<title>Sendproof: Preview unavailable and blocked</title>
<link rel="stylesheet" href="frame.css">
<style>
  #canvas { width: 1180px; padding: 40px 40px 52px; }
  .blocked { right: 28px; bottom: 30px; }
</style>
<script src="../../../artifacts/readme/raw/manifest.js"></script>
<script src="frame.js"></script>
</head>
<body>
<div id="canvas">
  <div class="window" style="position: relative; width: 1030px">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span><b>localhost:5189</b>/sendproof</span></div>
      <div class="tail"></div>
    </div>
    <!-- An operation the API marks preview: false because it writes to Redis: Send only, and it asks first. -->
    <div class="crop" data-raw="unavailable" data-region="work" data-width="1030" data-height="660"><img alt=""></div>
  </div>
  <div class="panel blocked" data-optional-group>
    <!-- A Preview the write guard stopped: the store, the command and the 409, with nothing written. -->
    <div class="crop" data-raw="blocked" data-region="body" data-width="460" data-height="330" data-optional><img alt=""></div>
  </div>
</div>
</body>
