name: Check and release Test Bench
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select package version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          version=$(dotnet msbuild adapters/dotnet/TestBench.AspNetCore -getProperty:Version)
          if [[ "$REF_TYPE" == tag ]]; then
            version=${REF_NAME#v}
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Invalid release tag: $REF_NAME" >&2
              exit 1
            fi
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "REPOSITORY_URL=$REPOSITORY_URL" >> "$GITHUB_ENV"
      - name: Build
        id: build
        run: dotnet build TestBench.slnx -c Release -warnaserror -p:Version="$PACKAGE_VERSION" -p:RepositoryUrl="$REPOSITORY_URL" -p:ContinuousIntegrationBuild=true
      - name: Test .NET
        id: dotnet_tests
        run: dotnet test TestBench.slnx -c Release --no-build -p:Version="$PACKAGE_VERSION" -p:RepositoryUrl="$REPOSITORY_URL" -p:ContinuousIntegrationBuild=true
      - name: Test JavaScript
        id: js_tests
        run: node --test tests/ui/*.test.mjs ui/*.test.mjs
      - run: npm ci --prefix tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: Test browser
        id: browser_tests
        run: node tools/browser-test.mjs --no-build
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
      - name: Pack both adapters and symbols
        id: pack
        run: |
          dotnet pack adapters/dotnet/TestBench.AspNetCore -c Release --no-build -o artifacts/packages -p:Version="$PACKAGE_VERSION" -p:RepositoryUrl="$REPOSITORY_URL" -p:ContinuousIntegrationBuild=true
          dotnet pack adapters/dotnet/TestBench.EntityFrameworkCore -c Release --no-build -o artifacts/packages -p:Version="$PACKAGE_VERSION" -p:RepositoryUrl="$REPOSITORY_URL" -p:ContinuousIntegrationBuild=true
      - name: Verify packages and install into a consumer
        id: consumer
        run: python3 tools/check-packages.py artifacts/packages
      - name: Create checksums
        run: |
          cd artifacts/packages
          sha256sum ./*.nupkg ./*.snupkg > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: artifacts/packages/
          if-no-files-found: error
      - name: Summarize release checks
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          DOTNET: ${{ steps.dotnet_tests.outcome }}
          JS: ${{ steps.js_tests.outcome }}
          BROWSER: ${{ steps.browser_tests.outcome }}
          PACK: ${{ steps.pack.outcome }}
          CONSUMER: ${{ steps.consumer.outcome }}
        run: |
          {
            echo '| Check | Outcome |'
            echo '| --- | --- |'
            echo "| Release build | $BUILD |"
            echo "| .NET tests | $DOTNET |"
            echo "| JavaScript tests | $JS |"
            echo "| Browser, accessibility and mock comparisons | $BROWSER |"
            echo "| NuGet packages and symbols | $PACK |"
            echo "| Archive and clean-install tests | $CONSUMER |"
          } >> "$GITHUB_STEP_SUMMARY"

  conformance-matrix:
    runs-on: ubuntu-latest
    outputs:
      bindings: ${{ steps.manifest.outputs.bindings }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read binding manifest
        id: manifest
        run: |
          bindings=$(node tests/conformance/run.mjs --matrix)
          echo "bindings=$bindings" >> "$GITHUB_OUTPUT"

  conformance:
    name: Protocol / ${{ matrix.id }} / ${{ matrix.database }}
    needs: conformance-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.conformance-matrix.outputs.bindings) }}
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7' || '' }}
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench_local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U bench -d postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: bench_local
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pbench_local --silent" --health-interval 3s --health-timeout 3s --health-retries 30
      sqlserver:
        image: ${{ matrix.database == 'sqlserver' && 'mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'BenchLocal_2026!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "BenchLocal_2026!" -C -Q "SELECT 1" -b'
          --health-interval 3s --health-timeout 5s --health-retries 35
    env:
      BENCH_POSTGRES_URL: ${{ matrix.database == 'postgresql' && 'postgresql://bench:bench_local@127.0.0.1:5432/postgres' || '' }}
      BENCH_MYSQL_URL: ${{ matrix.database == 'mysql' && 'mysql://root:bench_local@127.0.0.1:3306/mysql' || '' }}
      BENCH_SQLSERVER_URL: ${{ matrix.database == 'sqlserver' && 'mssql://sa:BenchLocal_2026%21@127.0.0.1:1433/master?encrypt=false&trustServerCertificate=true' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - if: matrix.toolchain == 'dotnet'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - if: matrix.toolchain == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - if: matrix.toolchain == 'java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.toolchain == 'go'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: adapters/go/**/go.sum
      - if: matrix.toolchain == 'php'
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3, mbstring, dom, pcntl
      - if: matrix.toolchain == 'ruby'
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '3.4'
      - name: Select Rust stable
        if: matrix.toolchain == 'rust'
        run: rustup toolchain install stable --profile minimal
      - run: npm ci --prefix tests/conformance
      - name: Prepare fixture
        if: matrix.prepare != ''
        env:
          PREPARE: ${{ matrix.prepare }}
        run: bash -euo pipefail -c "$PREPARE"
      - name: Run binding tests
        if: matrix.test != ''
        env:
          BINDING: ${{ matrix.id }}
        run: node tests/conformance/run.mjs --local-tests "$BINDING"
      - name: Check the Node public TypeScript API
        if: matrix.id == 'node-express'
        run: npm run typecheck --prefix adapters/node
      - name: Run shared HTTP checks
        env:
          BINDING: ${{ matrix.id }}
        run: node tests/conformance/run.mjs "$BINDING"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, conformance]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Verify artifact checksums
        working-directory: artifacts/packages
        run: sha256sum --check SHA256SUMS
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and matching symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
