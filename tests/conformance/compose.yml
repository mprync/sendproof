name: sendproof-conformance
services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench_local
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bench', '-d', 'postgres']
      interval: 3s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    # Many bindings' fixtures and the load tests share this server; the default 151 connections ran out.
    command: ['--max-connections=1000']
    environment:
      MYSQL_ROOT_PASSWORD: bench_local
      MYSQL_ROOT_HOST: '%'
    ports:
      - '127.0.0.1:53306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pbench_local', '--silent']
      interval: 3s
      timeout: 3s
      retries: 30
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    mem_limit: 4g
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: 'BenchLocal_2026!'
      MSSQL_MEMORY_LIMIT_MB: '2048'
    ports:
      - '127.0.0.1:51433:1433'
    healthcheck:
      test: ['CMD', '/opt/mssql-tools18/bin/sqlcmd', '-S', 'localhost', '-U', 'sa', '-P', 'BenchLocal_2026!', '-C', '-Q', 'SELECT 1', '-b']
      interval: 3s
      timeout: 5s
      retries: 35

  # Data stores (spec/data-stores.md). `docker compose up -d --wait mongodb redis dynamodb` starts the
  # batch-one stores; `--profile heavy-stores` adds Cassandra and OpenSearch for the separate heavy job.

  # A single-node replica set: MongoDB only supports transactions (and so Preview) on a replica set or
  # sharded cluster. The health check initiates the set on first run and then reports the member state.
  # Clients connect with `?directConnection=true`, because the member advertises its in-container address.
  mongodb:
    image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:57017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); quit(1) }"]
      interval: 3s
      timeout: 10s
      retries: 30
  # Redis has no rollback, so Sendproof only guards it. A password proves that AUTH never reaches captures.
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ['redis-server', '--requirepass', 'bench_redis_local', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'bench_redis_local', '--no-auth-warning', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
  # DynamoDB Local accepts any well-formed SigV4 credentials. `-sharedDb` makes every access key see the same tables.
  dynamodb:
    image: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-inMemory']
    ports:
      - '127.0.0.1:58000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://127.0.0.1:8000 || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
  # Batch two, heavy job only: start with `--profile heavy-stores`.
  cassandra:
    profiles: ['heavy-stores']
    image: cassandra:5.0@sha256:7ec032283c56c9ea7c022007b2fecdf5ca69c7a9871e0634f41ae05833dc1638
    mem_limit: 2g
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
      CASSANDRA_CLUSTER_NAME: bench
    ports:
      - '127.0.0.1:59042:9042'
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
  opensearch:
    profiles: ['heavy-stores']
    image: opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4
    mem_limit: 2g
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:59200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:9200/_cluster/health > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
