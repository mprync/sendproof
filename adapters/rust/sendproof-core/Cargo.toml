[package]
name = "sendproof-core"
description = "Framework-neutral core of the Sendproof protocol: capture, limits, traces, capabilities and the embedded workbench UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
build = "build.rs"
include = ["src/**", "build.rs", "ui-assets/**", "README.md", "LICENSE"]

[features]
default = ["tracing"]
# `SendproofLayer`: capture `tracing` events of the current request.
tracing = ["dep:tracing-subscriber"]

[dependencies]
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
