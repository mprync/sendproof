[workspace]
resolver = "3"
members = [
    "sendproof-core",
    "sendproof-journeys",
    "sendproof-axum",
    "sendproof-actix",
    "sendproof-sqlx",
    "sendproof-redis",
    "sendproof-dynamodb",
    "sendproof-mongodb",
    "sendproof-cassandra",
    "sendproof-elasticsearch",
    "../../examples/rust-conformance",
    "../../examples/rust-conformance-common",
    "../../examples/rust-conformance-actix",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Sendproof contributors"]
keywords = ["openapi", "api-testing", "axum", "actix-web", "rollback"]
categories = ["development-tools::testing", "web-programming"]

# The sendproof-* entries carry no version here; tools/release/crates.mjs stamps the release version
# (and the repository and homepage URLs) into a staged copy when it packs the crates.
[workspace.dependencies]
sendproof-core = { path = "sendproof-core" }
sendproof-actix = { path = "sendproof-actix" }
sendproof-axum = { path = "sendproof-axum" }
sendproof-sqlx = { path = "sendproof-sqlx" }
sendproof-redis = { path = "sendproof-redis" }
sendproof-dynamodb = { path = "sendproof-dynamodb" }
sendproof-mongodb = { path = "sendproof-mongodb" }
sendproof-cassandra = { path = "sendproof-cassandra" }
sendproof-elasticsearch = { path = "sendproof-elasticsearch" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path", "original-uri"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libsqlite3-sys = { version = "0.40", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio"] }
# `offline` turns on `Executor::describe`, which sendproof-sqlx's own `Executor` impls must then
# provide. Enabled here always, so they compile whether or not the application enables `sqlx/macros`.
sqlx-core = { version = "0.9.1", default-features = false, features = ["offline"] }
sqlx-sqlite = { version = "0.9.1", default-features = false, features = ["offline"] }
sqlx-postgres = { version = "0.9.1", default-features = false, features = ["offline"] }
sqlx-mysql = { version = "0.9.1", default-features = false, features = ["offline"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
redis = { version = "1", default-features = false }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `rustls-tls` is required by the driver; an application enables `dns-resolver` (for `mongodb+srv`) itself.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
scylla = { version = "1", default-features = false }
# The official Elasticsearch client ships only alpha releases, so the version is pinned exactly.
elasticsearch = { version = "=9.1.0-alpha.1", default-features = false, features = ["rustls-tls"] }
opensearch = { version = "2", default-features = false, features = ["rustls-tls"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
aws-smithy-runtime = "1"
aws-credential-types = "1"

[profile.release]
lto = "thin"
