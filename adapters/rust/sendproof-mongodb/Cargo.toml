[package]
name = "sendproof-mongodb"
description = "MongoDB Preview and write guard for Sendproof: a Preview runs in a transaction that is aborted, and reports document changes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# `Mongo` as an Axum extractor (`MongoStore: FromRef<State>`).
axum = ["dep:axum"]
# `Mongo` as an Actix Web extractor (`web::Data<MongoStore>` in `app_data`).
actix = ["dep:actix-web"]

[dependencies]
sendproof-core.workspace = true
mongodb = { workspace = true }
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
axum = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
