[package]
name = "testbench-sqlx"
description = "SQLx data layer for Test Bench (SQLite, PostgreSQL, MySQL): real transaction rollback previews with row-level change capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["sqlite"]
# SQLite: the pre-update hook captures every row change.
sqlite = ["sqlx/sqlite", "sqlx/sqlite-preupdate-hook", "dep:libsqlite3-sys"]
# PostgreSQL: session-temporary row triggers capture every row change.
postgres = ["sqlx/postgres", "sqlx/json"]
# MySQL: primary-key-scoped before/after reads around named statements.
mysql = ["sqlx/mysql", "sqlx/json"]
# `Db` as an Axum extractor.
axum = ["dep:axum"]
# `Db` as an Actix Web extractor (`web::Data<Pool<B>>` in `app_data`).
actix = ["dep:actix-web"]

[dependencies]
testbench-core.workspace = true
sqlx.workspace = true
libsqlite3-sys = { workspace = true, optional = true }
http.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }

[dev-dependencies]
testbench-axum.workspace = true
axum.workspace = true
sqlx-features-for-tests = { package = "testbench-sqlx", path = ".", features = ["axum", "postgres", "mysql"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
