[versions]
springBoot = "3.5.16"
springdoc = "2.8.17"
datasourceProxy = "1.11.1"
junit = "5.12.2"
kotlin = "2.3.21"
ktor = "3.6.1"
coroutines = "1.10.2"
jackson = "2.19.4"
victools = "4.38.0"
slf4j = "2.0.18"
mongodb = "5.5.2"
awssdk = "2.31.78"
lettuce = "6.6.0.RELEASE"
cassandraDriver = "4.19.2"
elasticsearchJava = "8.19.25"
opensearchJava = "2.26.0"
httpclient5 = "5.4.4"
firestore = "3.53.0"
azureCosmos = "4.78.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
datasource-proxy = { module = "net.ttddyy:datasource-proxy", version.ref = "datasourceProxy" }

jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
victools-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }
victools-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
mongodb-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
mongodb-reactivestreams = { module = "org.mongodb:mongodb-driver-reactivestreams", version.ref = "mongodb" }
mongodb-kotlin = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodb" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
cassandra-driver = { module = "org.apache.cassandra:java-driver-core", version.ref = "cassandraDriver" }
elasticsearch-java = { module = "co.elastic.clients:elasticsearch-java", version.ref = "elasticsearchJava" }
opensearch-java = { module = "org.opensearch.client:opensearch-java", version.ref = "opensearchJava" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
google-firestore = { module = "com.google.cloud:google-cloud-firestore", version.ref = "firestore" }
azure-cosmos = { module = "com.azure:azure-cosmos", version.ref = "azureCosmos" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
