[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "testbench-django"
version = "0.1.0a1"
description = "Test Bench workbench, rollback previews and observed sends for Django, Django REST framework and Django Ninja, with Django ORM capture."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Test Bench contributors" }]
keywords = ["django", "django-ninja", "djangorestframework", "openapi", "testing", "rollback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["testbench-core==0.1.0a1", "django>=4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/testbench_django"]
