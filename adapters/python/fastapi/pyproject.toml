[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "testbench-fastapi"
version = "0.1.0a1"
description = "Test Bench workbench, rollback previews and observed sends for FastAPI and Starlette applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Test Bench contributors" }]
keywords = ["swagger", "api-testing", "fastapi", "starlette", "openapi", "testing", "rollback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["testbench-core==0.1.0a1", "fastapi>=0.110"]

[tool.hatch.build.targets.wheel]
packages = ["src/testbench_fastapi"]

[tool.hatch.build.targets.sdist]
include = ["src/testbench_fastapi", "README.md", "LICENSE"]
