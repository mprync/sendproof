[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sendproof-core"
version = "0.1.0a3"
description = "Framework-neutral core of the Sendproof Python adapters: protocol, capture, trace store and embedded workbench UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sendproof contributors" }]
keywords = ["swagger", "api-testing", "openapi", "testing", "api", "workbench", "rollback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
# Client libraries for the data-store hooks in sendproof_core.stores; the core imports each on first use.
redis = ["redis>=5"]
dynamodb = ["boto3>=1.28"]
mongodb = ["pymongo>=4.9"]
cassandra = ["cassandra-driver>=3.29"]
elasticsearch = ["elasticsearch>=8,<9"]
opensearch = ["opensearch-py>=2,<3"]
# The Cosmos DB and Firestore hooks reach into private internals, so each is pinned to the minor
# versions it was verified against (sendproof_core/stores/versions.py); registration refuses others.
cosmosdb = ["azure-cosmos>=4.17,<4.18"]
firestore = ["google-cloud-firestore>=2.34,<2.35"]

[tool.hatch.build.targets.wheel]
packages = ["src/sendproof_core"]
# The UI bundle is generated from the shared packer and is not tracked by git.
artifacts = ["src/sendproof_core/ui/**"]

[tool.hatch.build.targets.sdist]
include = ["src/sendproof_core", "README.md", "LICENSE"]
artifacts = ["src/sendproof_core/ui/**"]
