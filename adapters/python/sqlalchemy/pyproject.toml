[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "testbench-sqlalchemy"
version = "0.1.0a1"
description = "SQLAlchemy rollback previews and change capture for Test Bench."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Test Bench contributors" }]
keywords = ["sqlalchemy", "testing", "rollback", "openapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = ["testbench-core==0.1.0a1", "sqlalchemy>=2.0"]

[project.optional-dependencies]
asyncio = ["sqlalchemy[asyncio]>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/testbench_sqlalchemy"]
