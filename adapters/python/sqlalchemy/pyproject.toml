[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sendproof-sqlalchemy"
version = "0.1.0a3"
description = "SQLAlchemy rollback previews and change capture for Sendproof."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sendproof contributors" }]
keywords = ["swagger", "api-testing", "sqlalchemy", "testing", "rollback", "openapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = ["sendproof-core==0.1.0a3", "sqlalchemy>=2.0"]

[project.optional-dependencies]
asyncio = ["sqlalchemy[asyncio]>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sendproof_sqlalchemy"]

[tool.hatch.build.targets.sdist]
include = ["src/sendproof_sqlalchemy", "README.md", "LICENSE"]
